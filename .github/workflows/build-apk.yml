name: Build & Publish Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.1.0)'
        required: false
        default: 'latest-apk'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Battery Boss Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare consistent debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -di debug.keystore.base64 > debug.keystore
            echo "Decoded consistent signing key from debug.keystore.base64"
          else
            echo "::error::debug.keystore.base64 is missing! Push debug.keystore.base64 so every build keeps the same signing signature and avoids package conflicts."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.${{ github.run_number }}"
          gradle :app:assembleDebug \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME" \
            --no-daemon

      - name: Prepare downloadable APK file
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/BatteryBossAdmin.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryBossAdmin-APK
          path: release-output/BatteryBossAdmin.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-apk') }}
          name: Battery Boss Admin APK (v1.${{ github.run_number }})
          body: |
            Automated Android APK build (`v1.${{ github.run_number }}`) for **Battery Boss Update Control**.

            Download `BatteryBossAdmin.apk` from Assets below.
            If you previously installed an older APK signed with a different key, uninstall the old **Battery Boss Admin** app once before installing this APK — all future GitHub builds will update smoothly in place.
          files: release-output/BatteryBossAdmin.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
