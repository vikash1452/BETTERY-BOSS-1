name: Build & Publish Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (leave blank for automatic v1.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Battery Boss Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & install API 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Downloading Android cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "cmdline-tools;latest"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore cached debug keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: battery-boss-admin-debug-keystore-v1

      - name: Prepare debug signing keystore and env files
        env:
          KEYSTORE_SECRET_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          rm -f local.properties
          [ -f .env.example ] || touch .env.example
          [ -f .env ] || cp .env.example .env

          if [ -n "$KEYSTORE_SECRET_B64" ]; then
            echo "$KEYSTORE_SECRET_B64" | base64 -di > debug.keystore
            echo "Decoded signing keystore from GitHub secret ANDROID_KEYSTORE_BASE64"
          elif [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -di debug.keystore.base64 > debug.keystore
            echo "Decoded signing keystore from debug.keystore.base64"
          elif [ -f debug.keystore ] && [ -s debug.keystore ]; then
            echo "Reusing cached debug.keystore"
          else
            keytool -genkeypair -v -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Battery Boss Admin,O=BatteryBoss,C=IN"
            echo "Generated new debug.keystore (will be cached for future builds)"
          fi

      - name: Build Debug APK
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.${{ github.run_number }}"
          gradle :app:assembleDebug \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME" \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Prepare downloadable APK file
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/BatteryBossAdmin.apk
          ls -lh release-output/BatteryBossAdmin.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryBossAdmin-APK
          path: release-output/BatteryBossAdmin.apk
          retention-days: 30

      - name: Determine release tag
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Battery Boss Admin APK (${{ steps.release_meta.outputs.tag }})
          body: |
            Automated Android APK build (`${{ steps.release_meta.outputs.tag }}`) for **Battery Boss Update Control**.

            Download `BatteryBossAdmin.apk` from Assets below.
          files: release-output/BatteryBossAdmin.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
